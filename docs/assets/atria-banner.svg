<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Atria — Design System Studio</title>
  <desc id="desc">A dark editorial banner for Atria, an open-source design system workspace built with React and Vite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191917"/>
      <stop offset="0.55" stop-color="#22211e"/>
      <stop offset="1" stop-color="#2b2924"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#c7c5b8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#c7c5b8" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c7c5b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0eee7"/>
      <stop offset="1" stop-color="#a9a79e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f7f7f5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .float { animation: float 7s ease-in-out infinite; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .drift { animation: drift 11s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes drift { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(10px,-8px) rotate(3deg); } }
      @media (prefers-reduced-motion: reduce) {
        .float, .pulse, .drift { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="21.5" fill="none" stroke="#f7f7f5" stroke-opacity="0.08"/>

  <g class="drift" opacity="0.9">
    <circle cx="1010" cy="84" r="118" fill="none" stroke="#f7f7f5" stroke-opacity="0.07"/>
    <circle cx="1010" cy="84" r="74" fill="none" stroke="#f7f7f5" stroke-opacity="0.05"/>
  </g>
  <g opacity="0.75">
    <path d="M930 310c70-42 141-48 228-15" fill="none" stroke="#f7f7f5" stroke-opacity="0.08" stroke-width="1.5"/>
    <path d="M946 326c57-30 117-35 188-15" fill="none" stroke="#f7f7f5" stroke-opacity="0.05" stroke-width="1.5"/>
  </g>

  <g transform="translate(72 58)">
    <g transform="rotate(-8 20 20)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#f2f0e9"/>
      <rect x="22" y="0" width="18" height="18" rx="3" fill="#f2f0e9" opacity="0.48"/>
      <rect x="0" y="22" width="18" height="18" rx="3" fill="#f2f0e9" opacity="0.48"/>
      <rect x="22" y="22" width="18" height="18" rx="3" fill="#f2f0e9"/>
    </g>
    <text x="62" y="30" fill="#f4f2ec" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.6">atria<tspan fill="#8f8d85">.</tspan></text>
  </g>

  <text x="74" y="164" fill="#b5b2a8" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3.4">OPEN-SOURCE DESIGN SYSTEM WORKSPACE</text>

  <text x="72" y="231" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="600" letter-spacing="-2.4">Design, structure,</text>
  <text x="72" y="286" fill="#f4f2ec" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" letter-spacing="-1.8">and consistency.</text>

  <g transform="translate(74 318)" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8">
    <rect x="0" y="-16" width="114" height="27" rx="13.5" fill="none" stroke="#f7f7f5" stroke-opacity="0.16"/>
    <text x="16" y="2" fill="#cfccc2">REACT 19</text>
    <rect x="124" y="-16" width="104" height="27" rx="13.5" fill="none" stroke="#f7f7f5" stroke-opacity="0.16"/>
    <text x="140" y="2" fill="#cfccc2">VITE 6</text>
    <rect x="238" y="-16" width="134" height="27" rx="13.5" fill="none" stroke="#f7f7f5" stroke-opacity="0.16"/>
    <text x="254" y="2" fill="#cfccc2">OPEN SOURCE</text>
  </g>

  <g class="float" transform="translate(828 52)">
    <rect width="300" height="256" rx="10" fill="#f8f8f6" fill-opacity="0.98"/>
    <rect width="300" height="256" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="16" y="16" width="268" height="1" fill="#e4e2dc"/>
    <text x="16" y="36" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="1.6">ATRIA / WORKSPACE</text>
    <text x="284" y="36" text-anchor="end" fill="#b7b4ab" font-family="Consolas, 'Courier New', monospace" font-size="7.5">PREVIEW 001</text>

    <text x="16" y="70" fill="#20201e" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.9">Good design</text>
    <text x="16" y="94" fill="#20201e" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.9">starts with a system.</text>

    <g transform="translate(16 114)">
      <rect width="268" height="52" fill="none" stroke="#e9e7e1"/>
      <line x1="89.3" y1="0" x2="89.3" y2="52" stroke="#e9e7e1"/>
      <line x1="178.6" y1="0" x2="178.6" y2="52" stroke="#e9e7e1"/>
      <text x="10" y="18" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6.5">FOUNDATIONS</text>
      <text x="10" y="38" fill="#20201e" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">04</text>
      <text x="99" y="18" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6.5">COMPONENTS</text>
      <text x="99" y="38" fill="#20201e" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">12</text>
      <text x="188" y="18" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6.5">TOKENS</text>
      <text x="188" y="38" fill="#20201e" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">28</text>
    </g>

    <text x="16" y="188" fill="#8e8b83" font-family="Consolas, 'Courier New', monospace" font-size="7">COLOUR PALETTE</text>
    <text x="284" y="188" text-anchor="end" fill="#8e8b83" font-family="Consolas, 'Courier New', monospace" font-size="7">NEUTRAL / 01</text>
    <g transform="translate(16 196)">
      <rect width="48" height="30" rx="2" fill="#171717"/>
      <rect x="52" width="48" height="30" rx="2" fill="#55534F"/>
      <rect x="104" width="48" height="30" rx="2" fill="#99958D"/>
      <rect x="156" width="48" height="30" rx="2" fill="#D5D1C8"/>
      <rect x="208" width="48" height="30" rx="2" fill="#EEECE7"/>
    </g>
    <text x="16" y="244" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6">INK</text>
    <text x="68" y="244" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6">STONE</text>
    <text x="120" y="244" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6">ASH</text>
    <text x="172" y="244" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6">MIST</text>
    <text x="224" y="244" fill="#a29f96" font-family="Consolas, 'Courier New', monospace" font-size="6">PAPER</text>
  </g>

  <circle class="pulse" cx="1114" cy="300" r="4" fill="#9fae8d"/>
  <text x="1128" y="304" fill="#8f9d82" font-family="Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="1.4">A SYSTEM IN PROGRESS</text>
</svg>
